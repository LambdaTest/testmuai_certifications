{% comment %}A call-to-action button. Include with url= and label=.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 4px;">
  <tr><td style="background:#111111;border-radius:8px;">
    <a href="{{ url }}" style="display:inline-block;padding:12px 22px;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ label }}</a>
  </td></tr>
</table>
