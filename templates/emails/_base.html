{% comment %}
  The shared look of every HTML email. Inline styles and tables, on purpose:
  many email clients (Gmail, Outlook) strip <style> blocks and ignore modern
  CSS, so this is the one place in the project written the old way.

  Context: everything from apps.exam.emails.context.build_context.
  Each email fills {% block content %}.
{% endcomment %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F8F9FB;font-family:Arial,Helvetica,sans-serif;color:#333333;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F9FB;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="width:100%;max-width:560px;background:#ffffff;border:1px solid #E8E8E8;border-radius:12px;">
        <tr><td style="padding:18px 28px;border-bottom:1px solid #E8E8E8;">
          <span style="font-size:15px;font-weight:bold;color:#101010;">TestMu AI</span>
          <span style="font-size:15px;color:#2C86EE;font-weight:bold;"> Certifications</span>
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.55;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #E8E8E8;font-size:12.5px;line-height:1.5;color:#666666;">
          Questions? Just reply to this email and our team will get back to you.<br>
          Booking reference <span style="font-family:monospace;color:#101010;">{{ ref }}</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
